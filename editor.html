<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Castorium Map Editor</title>
  <link rel="stylesheet" href="./editor.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <strong>🦫 Castorium Map Editor</strong>
      <button id="newScene">Nuevo</button>
      <button id="saveScene">Guardar</button>
      <button id="exportScene">Exportar JSON</button>
      <label class="file-button">Importar JSON<input id="importScene" type="file" accept="application/json,.json"></label>
      <span class="spacer"></span>
      <label>Grid <input id="gridSize" type="number" min="0.1" step="0.1" value="1"></label>
      <button id="toggleGrid" class="active"># Grid</button>
      <button id="focusSelected">F Enfocar</button>
      <a class="button-link" href="./index.html">Volver al juego</a>
    </header>

    <aside class="leftbar">
      <section>
        <div class="section-title"><b>Escena</b><button id="addObject">＋</button></div>
        <input id="treeFilter" placeholder="Buscar objeto..." />
        <div id="sceneTree"></div>
      </section>
      <section>
        <div class="section-title"><b>Capas</b></div>
        <div id="layerList"></div>
      </section>
      <section>
        <div class="section-title"><b>Piso</b></div>
        <div class="row"><button id="floorMode">🎨 Pintar</button><button id="eraseFloor">Borrar tile</button></div>
        <label>Ancho celdas <input id="floorWidth" type="number" min="1" max="100" value="30"></label>
        <label>Alto celdas <input id="floorDepth" type="number" min="1" max="100" value="20"></label>
        <button id="resizeFloor">Aplicar tamaño</button>
        <label class="file-button wide">Cargar tile 2D<input id="tileUpload" type="file" accept="image/*"></label>
        <div id="tilePalette"></div>
      </section>
    </aside>

    <main id="viewportWrap">
      <div id="viewport"></div>
      <div id="viewportHelp">G mover · R rotar · S escalar · X/Y/Z eje · Shift+D duplicar · H ocultar · Alt+H mostrar · Delete borrar · F enfocar</div>
      <div id="modeBadge">OBJETO</div>
    </main>

    <aside class="rightbar">
      <section>
        <div class="section-title"><b>Inspector</b></div>
        <div id="inspector" class="muted">Seleccioná un objeto.</div>
      </section>
      <section>
        <div class="section-title"><b>Biblioteca de modelos</b></div>
        <label class="file-button wide">Cargar GLB / GLTF<input id="modelUpload" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"></label>
        <div id="assetLibrary"></div>
      </section>
      <section>
        <div class="section-title"><b>Rutas autoelevador</b><button id="addRoute">＋</button></div>
        <select id="routeSelect"></select>
        <div id="routeEditor"></div>
      </section>
    </aside>
  </div>

  <dialog id="objectDialog">
    <form method="dialog">
      <div class="dialog-head"><h2>Agregar</h2><button value="cancel">✕</button></div>
      <input id="objectSearch" placeholder="Buscar..." />
      <div id="objectCatalog"></div>
    </form>
  </dialog>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    // Built-in editor assets live in the repo but use the same IndexedDB path as user-loaded models.
    // This keeps editor.js simple and makes the predefined castor behave exactly like any other GLB.
    const STORAGE_KEY = 'castorium.mapEditor.v1';
    const DB_NAME = 'castorium-editor-assets';
    const DB_STORE = 'blobs';
    const CASTOR_ASSET_ID = 'builtin-castorv2';

    function openEditorDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          if (!request.result.objectStoreNames.contains(DB_STORE)) request.result.createObjectStore(DB_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function hasStoredModel(key) {
      const db = await openEditorDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const req = tx.objectStore(DB_STORE).get(key);
        req.onsuccess = () => resolve(Boolean(req.result));
        req.onerror = () => reject(req.error);
      });
    }

    async function storeModel(key, blob) {
      const db = await openEditorDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(blob, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function preloadBuiltinCastor() {
      try {
        const dbKey = 'model:' + CASTOR_ASSET_ID;
        if (!(await hasStoredModel(dbKey))) {
          const response = await fetch('./models/castorv2.glb');
          if (!response.ok) throw new Error('HTTP ' + response.status);
          await storeModel(dbKey, await response.blob());
        }

        let saved = {};
        try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch {}
        saved.assets = Array.isArray(saved.assets) ? saved.assets : [];
        const existing = saved.assets.find(a => a.id === CASTOR_ASSET_ID);
        if (existing) {
          existing.name = '🦫 Castor v2 (predefinido)';
        } else {
          saved.assets.unshift({ id: CASTOR_ASSET_ID, name: '🦫 Castor v2 (predefinido)', animations: [], builtin: true });
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      } catch (error) {
        console.warn('No se pudo precargar castorv2.glb; el editor seguirá funcionando con placeholders.', error);
      }
    }

    await preloadBuiltinCastor();
    await import('./src/editor.js');
  </script>
</body>
</html>
